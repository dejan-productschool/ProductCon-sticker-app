<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Ship It</title>
<style>
  :root {
    --ink:#0A0A0B; --navy:#07182C; --paper:#FCFCFC; --brand:#2758E2;
    --key:#1A1B21; --key-hi:#262832; --muted:#8A8FA0; --line:#23252E;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; margin:0; overflow:hidden; }
  body {
    background:var(--ink); color:var(--paper);
    font:400 16px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    user-select:none;
  }
  body.kiosk, body.kiosk button { cursor:none; }

  .screen { display:none; width:100%; height:100%; padding:4vh 4vw; }
  .screen.on { display:flex; flex-direction:column; }

  /* ---- attract ---- */
  #attract { align-items:center; justify-content:center; text-align:center; gap:4vh; }
  #attract h1 { font-size:clamp(48px,11vw,190px); font-weight:900; letter-spacing:-.03em; margin:0; line-height:.95; }
  #attract h1 em { color:var(--brand); font-style:normal; }
  #attract p { font-size:clamp(20px,3vw,44px); color:var(--muted); margin:0; max-width:24ch; }
  .pulse { animation:pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.45} }

  /* ---- question + line screens share a two-column shell ---- */
  .head { display:flex; align-items:center; gap:2vw; margin-bottom:2.5vh; }
  .prompt { font-size:clamp(22px,3vw,46px); font-weight:800; letter-spacing:-.02em; margin:0; }
  .dots { margin-left:auto; display:flex; gap:10px; }
  .dots i { width:11px; height:11px; border-radius:50%; background:var(--line); display:block; }
  .dots i.on { background:var(--brand); }
  .dots i.done { background:var(--muted); }

  .cols { flex:1; display:flex; gap:3vw; min-height:0; }
  /* Phones, which is now nearly everyone: one column, choices first. */
  @media (max-width: 820px) {
    .screen { padding:2.6vh 5vw; }
    .cols { flex-direction:column; gap:2.4vh; }
    .choices { flex:none; gap:1.1vh; }
    .choices button { padding:1.8vh 2.2vh; font-size:17px; }
    .stage { flex:none; }
    .sofar { width:100%; flex-direction:row; gap:2vw; }
    .sofar .slot { flex:1; padding:1.4vh 1.6vh; font-size:13px; }
    .sofar .tail { display:none; }
    /* Content sits at the top and the buttons stay at the bottom, rather than
       everything floating in the middle of a tall phone screen. */
    #reveal, #ask { justify-content:flex-start; }
    .options { flex:none; align-content:start; grid-template-columns:1fr 1fr 1fr; gap:2.4vw; }
    .option .nm { font-size:12px; }
    .actions { margin-top:auto; gap:2.4vw; }
    .actions button { min-height:64px; font-size:14px; letter-spacing:.04em; }
    .prompt { font-size:20px; }
    .ownline { margin-top:1vh; }
    #wait img { width:52vw; }
  }
  .choices { flex:1.35; display:flex; flex-direction:column; gap:1.4vh; justify-content:center; min-width:0; }
  .choices button {
    width:100%; text-align:left; border:2px solid var(--line); border-radius:16px;
    background:var(--key); color:var(--paper); padding:2.2vh 3vh;
    font:700 clamp(17px,2.1vw,34px)/1.25 inherit; letter-spacing:-.01em;
  }
  .choices button:active { background:var(--key-hi); transform:translateY(2px); }
  .choices button.sel { border-color:var(--brand); background:var(--key-hi); }
  .choices .ghost { background:none; border-style:dashed; color:var(--muted); font-weight:600;
                    font-size:clamp(14px,1.6vw,24px); padding:1.6vh 3vh; }

  .stage { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.6vh; min-width:0; }
  /* No sticker is shown until both questions are answered. Rendering one from
     a single answer made the first question look like the whole point and then
     threw its answer away. This just tracks what is locked in. */
  .sofar { width:min(100%,42vh); display:flex; flex-direction:column; gap:1.6vh; }
  .sofar .slot { border:2px dashed var(--line); border-radius:14px; padding:2vh 2.4vh;
                 color:var(--muted); font-size:clamp(13px,1.5vw,22px); font-weight:600; }
  .sofar .slot.set { border-style:solid; border-color:var(--brand); background:var(--key);
                     color:var(--paper); }
  .sofar .slot small { display:block; font-size:.62em; letter-spacing:.14em; color:var(--muted);
                       font-weight:700; margin-bottom:.5em; }
  .sofar .tail { color:var(--muted); font-size:clamp(12px,1.3vw,19px); font-weight:600;
                 text-align:center; line-height:1.4; }

  /* ---- design picker ---- */
  .options { flex:1; display:grid; grid-template-columns:repeat(3,1fr); gap:2vw; align-content:center; }
  .option { background:none; border:6px solid transparent; border-radius:20px; padding:0; }
  .option img { width:100%; aspect-ratio:1; border-radius:12px; display:block; background:var(--key); }
  .option.sel { border-color:var(--brand); }
  .option .nm { font-size:clamp(13px,1.5vw,22px); color:var(--muted); padding:1vh 0 0; font-weight:600; }
  .option.sel .nm { color:var(--paper); }

  .actions { display:flex; gap:2vw; margin-top:2.5vh; }
  .actions button { min-height:11vh; border:0; border-radius:16px;
                    font:800 clamp(18px,2.6vw,40px)/1 inherit; letter-spacing:.06em; }
  .back { background:var(--key); color:var(--paper); flex:1; }
  .alt  { background:var(--key); color:var(--paper); flex:1.6; }
  .ship { background:var(--brand); color:#fff; flex:2.6; }
  .actions button[disabled] { opacity:.4; }
  .ownline { margin:1.6vh auto 0; background:none; border:0; color:var(--muted);
             font:600 clamp(13px,1.5vw,20px)/1 inherit; text-decoration:underline;
             text-underline-offset:5px; padding:1vh; }

  /* ---- free text ---- */
  #write { justify-content:space-between; }
  .field { flex:1; display:flex; align-items:center; border-bottom:4px solid var(--line);
           padding-bottom:2vh; min-height:16vh; }
  .field span { font-size:clamp(28px,5vw,80px); font-weight:800; letter-spacing:-.02em;
                line-height:1.08; word-break:break-word; }
  .field .placeholder { color:#2A2C36; }
  .caret { display:inline-block; width:.06em; background:var(--brand); margin-left:.04em;
           animation:blink 1s steps(1) infinite; vertical-align:-.06em; height:.95em; }
  @keyframes blink { 50%{opacity:0} }
  .count { text-align:right; color:var(--muted); font-size:clamp(14px,1.6vw,24px);
           padding:1.2vh 0; font-variant-numeric:tabular-nums; }
  .count.warn { color:var(--brand); }
  .kb { display:flex; flex-direction:column; gap:.9vh; }
  .kb .row { display:flex; gap:.8vw; justify-content:center; }
  .kb button { flex:1 1 0; min-height:8.4vh; border:0; border-radius:12px;
               background:var(--key); color:var(--paper); font:700 clamp(18px,2.4vw,34px)/1 inherit; }
  .kb button:active { background:var(--key-hi); transform:translateY(2px); }
  .kb .wide { flex:2 1 0; font-size:clamp(13px,1.5vw,20px); letter-spacing:.08em; }
  .kb .space { flex:6 1 0; }
  .kb .go { background:var(--brand); flex:3 1 0; letter-spacing:.08em; }
  .kb button[disabled] { opacity:.35; }

  /* ---- done ---- */
  #done { align-items:center; justify-content:center; text-align:center; gap:3vh; }
  #done h2 { font-size:clamp(40px,8vw,140px); font-weight:900; margin:0; letter-spacing:-.03em; }
  #done p { font-size:clamp(20px,2.6vw,40px); color:var(--muted); margin:0; max-width:24ch; }
  #done img { width:min(38vh,46vw); border-radius:16px; }
  .err { color:var(--brand); font-weight:700; }

  /* ---- queue + ticket ---- */
  #wait, #blocked { align-items:center; justify-content:center; text-align:center; gap:2.4vh; }
  .ticketwrap { display:flex; flex-direction:column; align-items:center; gap:2.2vh; max-width:560px; }
  .ticketno small { display:block; color:var(--muted); font-size:12px; font-weight:800; letter-spacing:.16em; }
  .ticketno b { display:block; font-size:clamp(52px,12vw,120px); font-weight:900; line-height:1;
                letter-spacing:-.04em; font-variant-numeric:tabular-nums; }
  #wait img { width:min(30vh,62vw); border-radius:14px; }
  #wait h2, #blocked h2 { font-size:clamp(24px,4.6vw,54px); font-weight:900; margin:0; letter-spacing:-.02em; }
  #wait p, #blocked p { font-size:clamp(15px,2.2vw,26px); color:var(--muted); margin:0; max-width:26ch; }
  #wait .fine { font-size:clamp(12px,1.6vw,18px); }
  .bar { width:min(420px,80vw); height:8px; border-radius:99px; background:var(--line); overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--brand); border-radius:99px;
           transition:width .6s ease; }
  #wait.ready h2 { color:#4ADE80; }
  #blocked h2 { color:var(--brand); }
  #blocked .ship { min-height:64px; border:0; border-radius:16px; color:#fff;
                   font:800 16px/1 inherit; letter-spacing:.06em; padding:0 4vh; }
</style>
</head>
<body>

<section id="attract" class="screen on">
  <h1>SHIP<br><em>IT</em></h1>
  <p>Four taps. One sticker. Yours to keep.</p>
  <p class="pulse" style="font-size:clamp(16px,2vw,30px)">Touch anywhere to start</p>
</section>

<section id="ask" class="screen">
  <div class="head">
    <p class="prompt" id="askPrompt"></p>
    <div class="dots" id="dots"></div>
  </div>
  <div class="cols">
    <div class="choices" id="askChoices"></div>
    <div class="stage">
      <div class="sofar" id="soFar"></div>
    </div>
  </div>
</section>

<section id="reveal" class="screen">
  <div class="head">
    <p class="prompt" id="revealLine"></p>
    <div class="dots" id="dots3"></div>
  </div>
  <div class="options" id="options"></div>
  <div class="actions">
    <button class="back" id="revealBack">BACK</button>
    <button class="alt" id="another">TRY ANOTHER LINE</button>
    <button class="ship" id="shipBtn">SHIP IT</button>
  </div>
  <button class="ownline" id="ownLine">None of these - write my own</button>
</section>

<section id="write" class="screen">
  <div>
    <p class="prompt">Write your own.</p>
    <div class="field"><span id="entry"><span class="placeholder">Start typing</span><i class="caret"></i></span></div>
    <div class="count" id="count"></div>
  </div>
  <div class="kb" id="kb"></div>
</section>

<section id="wait" class="screen">
  <div class="ticketwrap">
    <div class="ticketno"><small>YOUR NUMBER</small><b id="ticketNo">-</b></div>
    <img id="waitImg" alt="">
    <h2 id="waitState">In the queue</h2>
    <p id="waitDetail"></p>
    <div class="bar"><i id="waitBar"></i></div>
    <p class="fine" id="waitFine">Keep this screen. It updates on its own.</p>
  </div>
</section>

<section id="blocked" class="screen">
  <h2 id="blockedTitle">Hold on</h2>
  <p id="blockedMsg"></p>
  <button class="ship" id="blockedRetry" style="max-width:520px;margin-top:3vh">TRY AGAIN</button>
</section>

<section id="done" class="screen">
  <img id="doneImg" alt="">
  <h2>SHIPPED</h2>
  <p id="doneMsg">Your sticker is printing. Grab it from the volunteer.</p>
</section>

<script>
const IDLE_MS = 45000;

let cfg = { questions: [], maxChars: 64, freeText: true };
let step = 0;               // index into cfg.questions
let answers = {};
let lines = [];             // the three for this exact pair of answers
let lineAt = 0;
let templates = [];
let templateId = null;
let text = '';              // free-text path only
let idleTimer;
let ticketId = null;
let pollTimer = null;

/**
 * A stable id for this phone.
 *
 * The queue uses it to stop one person taking twenty slots, and to reunite
 * somebody with their ticket if they close the tab. It is a random string in
 * this browser's own storage - it identifies a device to the booth for the
 * afternoon, and is not tied to a person.
 */
const deviceId = (() => {
  try {
    let id = localStorage.getItem('shipit.device');
    if (!id) {
      id = (crypto.randomUUID?.() ?? String(Math.random()).slice(2)) + '';
      localStorage.setItem('shipit.device', id);
    }
    return id;
  } catch {
    // Private browsing. One session, no memory - still better than refusing.
    return (crypto.randomUUID?.() ?? String(Math.random()).slice(2)) + '';
  }
})();

const rememberTicket = (id) => { try { localStorage.setItem('shipit.ticket', String(id)); } catch {} };
const forgetTicket = () => { try { localStorage.removeItem('shipit.ticket'); } catch {} };
const savedTicket = () => { try { return Number(localStorage.getItem('shipit.ticket')) || null; } catch { return null; } };

const $ = (id) => document.getElementById(id);
const SCREENS = ['attract', 'ask', 'reveal', 'write', 'wait', 'blocked', 'done'];
const on = (id) => $(id).classList.contains('on');
const line = () => (text ? text : lines[lineAt] ?? '');

function go(name) {
  SCREENS.forEach((s) => $(s).classList.toggle('on', s === name));
  // A phone is nobody else's turn - the idle reset only makes sense while
  // somebody is part-way through choosing, never while they hold a ticket.
  resetIdle(['attract', 'wait', 'blocked', 'done'].includes(name) ? null : IDLE_MS);
}

// The attract loop is what keeps the station usable when somebody walks off
// part-way through, which happens constantly at a booth.
function resetIdle(ms) {
  clearTimeout(idleTimer);
  if (!ms) return;
  idleTimer = setTimeout(reset, ms);
}

function reset() {
  step = 0; answers = {}; lines = []; lineAt = 0; templateId = null; text = '';
  ticketId = null;
  stopPolling();
  forgetTicket();
  go('attract');
}

/**
 * Bind a touch action.
 *
 * Everything responds to pointerdown, not click. On a touchscreen click arrives
 * 100-300 ms after the finger lands, which across four taps is most of a second
 * of the station feeling broken.
 */
function tap(el, fn) {
  el.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (!el.disabled) fn();
  });
}

const renderUrl = (t, tpl) => `/api/render?text=${encodeURIComponent(t)}&template=${tpl}`;
const escapeHtml = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[c]));

function dots(container, active) {
  const total = cfg.questions.length + 1; // the questions, then the reveal
  container.innerHTML = Array.from({ length: total }, (_, i) =>
    `<i class="${i === active ? 'on' : i < active ? 'done' : ''}"></i>`).join('');
}

// ---------------------------------------------------------------- questions

/**
 * What is locked in so far.
 *
 * Deliberately not a sticker. Showing a finished sticker built from one answer
 * made the first question look like the whole point, and then replaced it - so
 * the question read as pointless. Both answers feed one message; until there
 * are two, there is no message.
 */
function renderSoFar() {
  const slots = cfg.questions.map((q) => {
    const opt = q.options.find((o) => o.id === answers[q.id]);
    return `<div class="slot ${opt ? 'set' : ''}">
        <small>${escapeHtml(q.prompt.replace(/[?.]$/, '').toUpperCase())}</small>
        ${opt ? escapeHtml(opt.label) : '&mdash;'}
      </div>`;
  });
  const left = cfg.questions.filter((q) => !answers[q.id]).length;
  slots.push(`<div class="tail">${left
    ? `${left} more, then your line appears`
    : 'Building your line&hellip;'}</div>`);
  $('soFar').innerHTML = slots.join('');
}

function askQuestion() {
  const q = cfg.questions[step];
  $('askPrompt').textContent = q.prompt;
  dots($('dots'), step);

  $('askChoices').innerHTML = q.options
    .map((o) => `<button data-id="${o.id}" class="${answers[q.id] === o.id ? 'sel' : ''}">${escapeHtml(o.label)}</button>`)
    .join('');
  [...$('askChoices').children].forEach((el) => tap(el, () => answer(q.id, el.dataset.id)));

  renderSoFar();
  go('ask');
}

async function answer(questionId, value) {
  answers[questionId] = value;
  resetIdle(IDLE_MS);

  [...$('askChoices').children].forEach((el) => el.classList.toggle('sel', el.dataset.id === value));
  renderSoFar();

  // A short beat so the choice registers before the screen moves.
  await new Promise((r) => setTimeout(r, 260));

  step += 1;
  if (step < cfg.questions.length) return askQuestion();

  const res = await fetch('/api/lines', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ answers }),
  });
  const data = await res.json();
  lines = data.lines;
  lineAt = 0;
  text = '';
  showReveal();
}

// ------------------------------------------------------- the reveal

async function showReveal() {
  const current = line();
  if (!current) return;

  const res = await fetch(`/api/options?text=${encodeURIComponent(current)}`);
  if (!res.ok) return;
  const data = await res.json();

  templates = data.templates;
  templateId = templates[0]?.id ?? null;

  dots($('dots3'), cfg.questions.length);
  $('revealLine').textContent = `"${data.text}"`;
  $('another').style.visibility = lines.length > 1 && !text ? 'visible' : 'hidden';
  $('ownLine').style.display = cfg.freeText ? 'block' : 'none';

  $('options').innerHTML = templates.map((t, i) => `
    <button class="option ${i === 0 ? 'sel' : ''}" data-id="${t.id}">
      <img src="${renderUrl(data.text, t.id)}" alt="${t.name}">
      <div class="nm">${t.name}</div>
    </button>`).join('');

  [...$('options').children].forEach((el) => tap(el, () => {
    templateId = el.dataset.id;
    [...$('options').children].forEach((o) => o.classList.toggle('sel', o === el));
    resetIdle(IDLE_MS);
  }));

  go('reveal');
}

/** Cycle to the next line for the same pair of answers. */
function anotherLine() {
  if (!lines.length) return;
  lineAt = (lineAt + 1) % lines.length;
  resetIdle(IDLE_MS);
  showReveal();
}

// -------------------------------------------------------------------- ship

async function ship() {
  const current = line();
  if (!templateId || !current) return;
  $('shipBtn').disabled = true;

  // A stable id for this attempt. If the phone loses signal and retries, the
  // booth hands back the same ticket instead of printing a second sticker.
  const requestId = (crypto.randomUUID?.() ?? `${deviceId}-${Date.now()}`);

  try {
    const res = await fetch('/api/submit', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: current, templateId, answers, deviceId, requestId }),
    });
    const data = await res.json();

    if (!res.ok) return showBlocked(data);

    ticketId = data.ticketId;
    rememberTicket(ticketId);
    $('waitImg').src = renderUrl(current, templateId);
    showTicket(data);
    startPolling();
  } catch {
    showBlocked({ error: 'offline' });
  } finally {
    $('shipBtn').disabled = false;
  }
}

// ------------------------------------------------------------ the queue

const BLOCKED_COPY = {
  'at-capacity': ['We are at capacity', 'Too many stickers already queued to promise you one. Try again in a few minutes.'],
  'printer-down': ['Printer paused', 'It is being looked at. Nothing already queued is lost.'],
  'already-queued': ['You are already in the queue', 'One sticker at a time, so everybody gets one.'],
  'cooldown': ['You just had one', 'Give someone else a turn - you can go again shortly.'],
  'offline': ['Cannot reach the booth', 'Check you are still on the venue network, then try again.'],
};

function showBlocked(data) {
  const [title, msg] = BLOCKED_COPY[data.error] ?? ['Something went wrong', 'Tell someone at the booth.'];
  $('blockedTitle').textContent = title;
  $('blockedMsg').textContent = data.capacity?.state === 'busy' || data.capacity?.state === 'closed'
    ? `${msg} Currently ${data.capacity.wait}.`
    : data.retryInSeconds
      ? `${msg} About ${Math.ceil(data.retryInSeconds / 60)} more minutes.`
      : msg;

  // If they already hold a ticket, take them back to it rather than stranding
  // them on an error screen.
  if (data.ticketId) {
    ticketId = data.ticketId;
    rememberTicket(ticketId);
    $('blockedRetry').textContent = 'SEE MY STICKER';
  } else {
    $('blockedRetry').textContent = 'TRY AGAIN';
  }
  go('blocked');
}

function showTicket(t) {
  $('ticketNo').textContent = `#${t.id ?? ticketId}`;
  const wrap = $('wait');

  if (t.status === 'printed') {
    wrap.classList.add('ready');
    $('waitState').textContent = 'Ready';
    $('waitDetail').textContent = 'Collect it from the booth. Show this number.';
    $('waitBar').style.width = '100%';
    $('waitFine').textContent = 'Thanks for shipping.';
    stopPolling();
  } else if (t.status === 'rejected') {
    wrap.classList.remove('ready');
    $('waitState').textContent = 'Not this one';
    $('waitDetail').textContent = 'The booth passed on that sticker. Have another go.';
    $('waitBar').style.width = '0';
    $('waitFine').textContent = '';
    stopPolling();
  } else if (!t.printerOk) {
    wrap.classList.remove('ready');
    $('waitState').textContent = 'Printer paused';
    $('waitDetail').textContent = 'Yours is safe in the queue. It will print as soon as the printer is back.';
    $('waitFine').textContent = 'Keep this screen.';
  } else {
    wrap.classList.remove('ready');
    $('waitState').textContent = t.status === 'printing' ? 'Printing now' : 'In the queue';
    $('waitDetail').textContent = t.position > 1
      ? `${t.position - 1} ahead of you - ${t.wait}.`
      : 'You are next.';
    $('waitFine').textContent = 'Keep this screen. It updates on its own.';
    // Position 1 is nearly there; a long queue starts near empty.
    const pct = Math.max(4, 100 - Math.min(100, (t.position - 1) * 6));
    $('waitBar').style.width = `${pct}%`;
  }
  go('wait');
}

/**
 * Polling, not SSE.
 *
 * A phone in a pocket suspends its tab and silently drops an event stream. A
 * poll that resumes when the screen comes back is unglamorous and survives it.
 */
function startPolling() {
  stopPolling();
  const tick = async () => {
    if (!ticketId || document.hidden) return;
    try {
      const res = await fetch(`/api/ticket/${ticketId}`);
      if (res.ok) showTicket(await res.json());
    } catch { /* the booth will still be there in three seconds */ }
  };
  pollTimer = setInterval(tick, 3000);
  tick();
}

function stopPolling() {
  clearInterval(pollTimer);
  pollTimer = null;
}

document.addEventListener('visibilitychange', () => {
  if (!document.hidden && ticketId) startPolling();
});

// --------------------------------------------------------- free text escape

function renderEntry() {
  $('entry').innerHTML = text
    ? escapeHtml(text) + '<i class="caret"></i>'
    : '<span class="placeholder">Start typing</span><i class="caret"></i>';
  const left = cfg.maxChars - text.length;
  $('count').textContent = `${left} left`;
  $('count').classList.toggle('warn', left <= 10);
  document.querySelectorAll('#kb button[data-char]').forEach((b) => { b.disabled = left <= 0; });
  if ($('kbGo')) $('kbGo').disabled = text.trim().length === 0;
}

function key(ch) {
  if (text.length >= cfg.maxChars) return;
  text += ch;
  renderEntry();
  resetIdle(IDLE_MS);
}

function buildKeyboard() {
  const kb = $('kb');
  kb.innerHTML = '';
  ['QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM'].forEach((row, i) => {
    const div = document.createElement('div');
    div.className = 'row';
    [...row].forEach((ch) => {
      const b = document.createElement('button');
      b.textContent = ch; b.dataset.char = ch; tap(b, () => key(ch));
      div.appendChild(b);
    });
    if (i === 2) {
      const del = document.createElement('button');
      del.className = 'wide'; del.textContent = 'DELETE';
      tap(del, () => { text = text.slice(0, -1); renderEntry(); resetIdle(IDLE_MS); });
      div.appendChild(del);
    }
    kb.appendChild(div);
  });

  const last = document.createElement('div');
  last.className = 'row';
  for (const ch of ",.'!?") {
    const b = document.createElement('button');
    b.textContent = ch; b.dataset.char = ch; tap(b, () => key(ch));
    last.appendChild(b);
  }
  const space = document.createElement('button');
  space.className = 'space'; space.textContent = 'SPACE'; space.dataset.char = ' ';
  tap(space, () => key(' '));
  last.appendChild(space);

  const goBtn = document.createElement('button');
  goBtn.className = 'go'; goBtn.id = 'kbGo'; goBtn.textContent = 'USE THIS';
  tap(goBtn, () => { if (text.trim()) { text = text.trim(); showReveal(); } });
  last.appendChild(goBtn);
  kb.appendChild(last);
}

// ------------------------------------------------------------------ wiring

tap($('attract'), () => { step = 0; answers = {}; askQuestion(); });
tap($('revealBack'), () => { text = ''; step = cfg.questions.length - 1; askQuestion(); });
tap($('another'), anotherLine);
tap($('ownLine'), () => { text = ''; renderEntry(); go('write'); });
tap($('shipBtn'), ship);
tap($('blockedRetry'), () => {
  if (ticketId) { showTicketFromServer(); startPolling(); }
  else showReveal();
});

async function showTicketFromServer() {
  try {
    const res = await fetch(`/api/ticket/${ticketId}`);
    if (res.ok) return showTicket(await res.json());
  } catch {}
  reset();
}

// A physical keyboard drives the whole thing: number keys pick options, Enter
// advances, Escape goes back. There is no keyboard at the booth, but there is
// one while building, and a volunteer can plug one in to unstick the station.
document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || /^F\d+$/.test(e.key) || e.key === 'Tab') {
    e.preventDefault();
    return;
  }

  if (on('attract')) { e.preventDefault(); step = 0; answers = {}; askQuestion(); return; }

  if (on('write')) {
    if (e.key === 'Enter') { e.preventDefault(); if (text.trim()) { text = text.trim(); showReveal(); } return; }
    if (e.key === 'Backspace') { e.preventDefault(); text = text.slice(0, -1); renderEntry(); resetIdle(IDLE_MS); return; }
    if (e.key === 'Escape') { e.preventDefault(); text = ''; showReveal(); return; }
    if ([...e.key].length === 1 && !e.repeat) { e.preventDefault(); key(e.key); }
    return;
  }

  const list = on('ask') ? $('askChoices') : on('reveal') ? $('options') : null;
  if (list) {
    const els = [...list.children];
    const n = Number(e.key);
    if (n >= 1 && n <= els.length) {
      e.preventDefault();
      els[n - 1].dispatchEvent(new PointerEvent('pointerdown'));
      return;
    }
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) {
      e.preventDefault();
      const at = els.findIndex((el) => el.classList.contains('sel'));
      const fwd = e.key === 'ArrowRight' || e.key === 'ArrowDown';
      els[(Math.max(at, 0) + (fwd ? 1 : els.length - 1)) % els.length]
        .dispatchEvent(new PointerEvent('pointerdown'));
      return;
    }
  }

  if (on('reveal')) {
    if (e.key === 'Enter') { e.preventDefault(); ship(); return; }
    if (e.key === ' ') { e.preventDefault(); anotherLine(); return; }
  }
  if (e.key === 'Escape') { e.preventDefault(); reset(); }
});

document.addEventListener('contextmenu', (e) => e.preventDefault());
document.addEventListener('gesturestart', (e) => e.preventDefault());
document.addEventListener('pointerdown', () => {
  if (!on('attract')) resetIdle(on('done') ? 7000 : IDLE_MS);
});

fetch('/api/config').then((r) => r.json()).then((c) => {
  cfg = c;
  const param = new URLSearchParams(location.search).get('kiosk');
  document.body.classList.toggle('kiosk', param === null ? !!c.kiosk : param === '1');
  buildKeyboard();
  renderEntry();

  // Somebody who closed the tab and scanned again should land back on their
  // ticket, not at the start of a survey they already finished.
  const held = savedTicket();
  if (held) {
    ticketId = held;
    fetch(`/api/ticket/${held}`).then((r) => (r.ok ? r.json() : null)).then((t) => {
      if (!t || t.status === 'rejected') return forgetTicket();
      $('waitImg').src = renderUrl(t.text, t.templateId);
      showTicket(t);
      if (t.status !== 'printed') startPolling();
    }).catch(() => {});
  }
});
</script>
</body>
