<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Approve</title>
<style>
  :root { --ink:#14141C; --paper:#fff; --brand:#E8443A; --ok:#16C79A; --muted:#8A8FA0; --card:#1D1D28; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; background:var(--ink); color:var(--paper); font:400 16px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { position:sticky; top:0; z-index:5; background:var(--ink); border-bottom:1px solid #2A2A36; padding:14px 18px; display:flex; align-items:center; gap:14px; }
  header h1 { font-size:19px; margin:0; font-weight:800; letter-spacing:.02em; }
  .pill { margin-left:auto; font-size:13px; font-weight:700; padding:6px 12px; border-radius:99px; background:#26262F; color:var(--muted); }
  .pill.bad { background:var(--brand); color:#fff; }
  .banner { background:var(--brand); color:#fff; padding:12px 18px; font-weight:700; font-size:15px; display:none; }
  .banner.on { display:block; }
  main { padding:18px; display:grid; gap:18px; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); }
  .card { background:var(--card); border-radius:16px; overflow:hidden; border:2px solid transparent; }
  .card.flagged { border-color:var(--brand); }
  .card.failed { border-color:#FFC531; }
  .card img { width:100%; aspect-ratio:1; display:block; background:#fff; }
  .meta { padding:12px 14px; font-size:13px; color:var(--muted); display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .tag { font-size:11px; font-weight:800; letter-spacing:.06em; padding:3px 8px; border-radius:6px; background:#33333F; color:var(--paper); }
  .tag.flag { background:var(--brand); }
  .tag.fail { background:#FFC531; color:#14141C; }
  .row { display:flex; }
  .row button { flex:1; border:0; padding:20px 0; font:800 16px/1 inherit; letter-spacing:.08em; color:#fff; }
  .no { background:#3A3A46; }
  .yes { background:var(--ok); color:#08251C; }
  .row button:active { filter:brightness(.85); }
  .inflight { padding:0 18px; display:none; }
  .inflight.on { display:block; }
  .inflight div { background:#26262F; border-radius:10px; padding:10px 14px; margin-top:14px;
                  font-size:13px; color:var(--muted); display:flex; gap:10px; align-items:center; }
  .inflight b { color:var(--paper); }
  .empty { grid-column:1/-1; text-align:center; color:var(--muted); padding:22vh 0; }
  .empty b { display:block; font-size:26px; color:var(--paper); margin-bottom:8px; }
</style>
</head>
<body>
<header>
  <h1>Approve</h1>
  <span class="pill" id="printed">0 printed</span>
  <span class="pill" id="printer">printer</span>
</header>
<div class="banner" id="banner"></div>
<div class="inflight" id="inflight"></div>
<main id="queue"></main>

<script>
const $ = (id) => document.getElementById(id);
let busy = new Set();

function card(s) {
  const failed = s.status === 'failed';
  const tags = [
    s.flagged ? '<span class="tag flag">FLAGGED</span>' : '',
    failed ? '<span class="tag fail">PRINT FAILED</span>' : '',
    `<span class="tag">${s.template_id}</span>`,
  ].join('');
  return `
    <div class="card ${s.flagged ? 'flagged' : ''} ${failed ? 'failed' : ''}">
      <img src="/api/sticker/${s.id}.png" alt="">
      <div class="meta">${tags}<span>#${s.id}</span>${failed ? `<span>${esc(s.last_error ?? '')}</span>` : ''}</div>
      <div class="row">
        <button class="no" onclick="decide(${s.id},'reject')">REJECT</button>
        <button class="yes" onclick="decide(${s.id},'approve')">${failed ? 'PRINT AGAIN' : 'APPROVE'}</button>
      </div>
    </div>`;
}

const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[c]));

// One tap, no confirmation dialog. A confirm step at a booth just means the
// volunteer taps twice as fast and stops reading either one.
async function decide(id, action) {
  if (busy.has(id)) return;
  busy.add(id);
  document.querySelector(`[onclick="decide(${id},'${action}')"]`)?.closest('.card')?.remove();
  try {
    await fetch(`/api/queue/${id}/${action}`, { method: 'POST' });
  } finally {
    busy.delete(id);
    load();
  }
}

async function load() {
  const res = await fetch('/api/queue');
  const { pending, inFlight, counts, printer } = await res.json();

  $('queue').innerHTML = pending.length
    ? pending.map(card).join('')
    : '<div class="empty"><b>Queue is clear</b>Nothing waiting.</div>';

  // Approved but not yet out of the printer. Shown so a sticker is never
  // invisible to the person the attendee is standing in front of.
  $('inflight').classList.toggle('on', inFlight.length > 0);
  $('inflight').innerHTML = inFlight
    .map((s) => `<div><b>#${s.id}</b> ${esc(s.text)} - ${s.status}${s.attempts > 1 ? ` (retry ${s.attempts})` : ''}</div>`)
    .join('');

  $('printed').textContent = `${counts.printed ?? 0} printed`;
  $('printer').textContent = printer.ok ? `printer ok - ${printer.mode}` : 'PRINTER PROBLEM';
  $('printer').className = 'pill' + (printer.ok ? '' : ' bad');

  const banner = $('banner');
  banner.classList.toggle('on', !printer.ok);
  if (!printer.ok) banner.textContent = `Printer: ${printer.detail}`;
}

// Live, so the volunteer never has to think about refreshing. The poll is the
// belt to the SSE braces: if the stream dies, the tablet still updates.
const events = new EventSource('/api/events');
['queued', 'printed', 'print-failed', 'print-retry', 'rejected'].forEach((e) =>
  events.addEventListener(e, load));
setInterval(load, 5000);
load();
</script>
</body>
</html>
